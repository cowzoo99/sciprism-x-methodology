[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sciprism-x-methodology"
version = "0.1.0"
requires-python = "==3.11.9"
dependencies = [
  "numpy==2.3.4",
  "scipy==1.16.3",
  "pandas==2.3.3",
  "pyarrow==22.0.0",
  "pydantic==2.12.3",
  "PyYAML==6.0.3",
  "networkx==3.5",
  "sympy==1.14.0",
  "pint==0.25.2",
  "spacy==3.8.7",
  "click==8.1.8",
  "torch==2.15.0",
  "transformers==4.57.1",
  "scikit-learn==1.7.2",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==7.1.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "uv==0.13.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sciprism_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "--basetemp=.pytest_tmp"]
