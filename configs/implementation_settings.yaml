transport:
  dtype: float64
  loss_normalizer_percentile: 0.95
  loss_normalizer_floor: 1.0e-12
  max_iterations: 1000
  marginal_tolerance: 1.0e-9
  objective_tolerance: 1.0e-12
  stable_iterations: 5
  epsilon_grid: [0.01, 0.03, 0.05, 0.10]
  lambda_structure_grid: [0.25, 0.50, 1.00, 2.00]
  lambda_constraint_grid: [0.25, 0.50, 1.00, 2.00]
  node_cost_weights:
    motif: 0.16666666666666666
    role: 0.16666666666666666
    modality: 0.16666666666666666
    evidence_anchor: 0.16666666666666666
    variable_equation_anchor: 0.16666666666666666
    scibert_cosine: 0.16666666666666666
  unresolved_soft_penalty: 0.50
  unavailable_soft_penalty: 1.00
  greedy_mass_tolerance: 1.0e-12
  greedy_numerical_tolerance: 1.0e-9
  greedy_lp_method: highs-ds
  greedy_lp_presolve: true
  greedy_lp_primal_feasibility_tolerance: 1.0e-9
  greedy_lp_dual_feasibility_tolerance: 1.0e-9
  greedy_lp_edge_weight_strategy: dantzig
residuals:
  gamma_grid: [0.10, 0.25, 0.50]
  missing_penalty_grid: [0.50, 1.00, 2.00]
  unsupported_penalty_grid: [0.50, 1.00, 2.00]
  normalizer_percentile: 0.95
  normalizer_floor: 1.0e-12
  pcs_coefficient_grid: [0.25, 0.50, 1.00, 2.00]
  minimum_support_threshold: 0.50
  residual_consistency_beta: [-0.50, -0.50, -0.50, -0.50, -0.50, -0.50]
graph:
  short_fragment_token_threshold: 4
  explicit_cue_confidence: 1.0
  lexical_cue_confidence: 0.8
  learned_recognizer_threshold: 0.75
  learned_recognizer_margin: 0.05
  salience_weights:
    inverse_position: 0.25
    motif_confidence: 0.25
    variable_reuse: 0.25
    graph_centrality: 0.25
response_reconstruction:
  fixture_profile:
    physical_error: 0.0
    logical_error: 0.0
    unit_error: 0.0
    causal_error: 0.0
    modal_evidence_error: 0.0
    uncertainty_error: 0.0
    endpoint_error: 0.0
    motif_omission: 0.0
    unsupported_content: 0.0
    length_ratio: 1.0
    evidence_synthesis: 1.0
baseline_reconstruction:
  endpoint_case_sensitive: false
  endpoint_strip_whitespace: true
  endpoint_collapse_whitespace: true
  attribution_lowercase: true
  attribution_token_pattern: '[A-Za-z0-9]+'
  attribution_empty_overlap_score: 0.0
  taxonomy_patterns:
    - [unsupported, [unsupported, without evidence, not supported]]
    - [contradiction, [contradicts, inconsistent, opposite]]
    - [unit, [unit mismatch, wrong unit, dimensionally incompatible]]
    - [causal_direction, [reversed cause, reversed causal]]
    - [overconfidence, [overconfident, certain despite]]
  taxonomy_no_failure_score: 1.0
  taxonomy_failure_score: 0.0
  taxonomy_lowercase: true
  uncertainty_maximum_entropy: 1.0
  support_clip_to_unit_interval: true
  transport_score_transform: exp_negative_cost
  relation_multiset: true
  ranking_descending: true
  representation_dimensions: 256
  task_success_threshold: 0.50
  matched_context_rotations: 3
  local_judge_component_weights: [0.20, 0.20, 0.20, 0.20, 0.20]
  dbp_validation_transport_epsilon: 0.05
  support_neighbors_grid: [1, 3, 5, 10, 20]
  support_distance_scale_grid: [0.25, 0.50, 1.00, 2.00, 4.00]
  uncertainty_mode_codes: [0, 1, 2]
  graph_edit_cost_grid: [0.50, 1.00, 2.00]
  graph_edit_timeout_seconds: 2.0
dbp_reconstruction:
  signature_neighborhood_hops: 2
  local_transport_hops: 2
  signature_cosine_weight: 0.50
  relation_overlap_weight: 0.50
validators:
  symbolic_timeout_seconds: 2.0
  model_root: data/raw/models
  scibert_pooling: attention_masked_mean
  scibert_max_length: 512
  bart_max_length: 512
  learned_pass_threshold: 0.8
  learned_fail_threshold: 0.8
  nli_proxy_feature_weights: [0.20, 0.20, 0.20, 0.20, 0.20]
  nli_proxy_contradiction_count_scale: 2.0
  tfidf_proxy:
    lowercase: true
    analyzer: word
    ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0
    max_features: null
    norm: l2
    use_idf: true
    smooth_idf: true
    sublinear_tf: false
    binary: false
    strip_accents: null
    stop_words: null
    token_pattern: '(?u)\b\w\w+\b'
    dtype: float64
  scibert:
    model_id: allenai/scibert_scivocab_uncased
    revision: 24f92d32b1bfb0bcaf9ab193ff3ad01e87732fc1
  bart_mnli:
    model_id: facebook/bart-large-mnli
    revision: d7645e127eaf1aefc7862fd59a17a5aa8558b8ce
state_field:
  dimensions: [15, 64, 16]
  energy_dimensions: [31, 32, 1]
  activation: gelu
  gelu_approximate: none
  linear_bias: true
  initialization: kaiming_uniform_linear_default
  dropout: 0.0
  dropout_inplace: false
  optimizer: adamw
  learning_rate_grid: [3.0e-4, 1.0e-3, 3.0e-3]
  weight_decay_grid: [0.0, 1.0e-4, 1.0e-3]
  batch_size: 64
  energy_loss_weight_grid: [0.25, 0.50, 1.00]
  energy_margin_grid: [0.50, 1.00, 2.00]
  early_stopping_min_delta: 0.0
  adamw_betas: [0.9, 0.999]
  adamw_eps: 1.0e-8
  class_weighting: inverse_frequency_mean_one
  deterministic_shuffling: true
boundary:
  mad_floor: 1.0e-12
  mad_consistency_factor: 1.0
  standardized_radii: [0.25, 0.50, 1.00]
  symbolic_depth_steps: [1, 2, 3]
  context_composition_steps: [1, 2, 3]
  dbp_removal_ratios: [0.05, 0.10, 0.20]
  dbp_seed_fractions: [0.25, 0.20, 0.10]
  evidence_removal_rule: ceil_fraction_preserve_one
  dbp_edge_removal_rule: ceil_fraction_preserve_one
  seed_alignment_rounding: nearest_integer
open_set:
  cluster_counts: [2, 3, 4, 5, 6, 7, 8, 9, 10]
  cluster_selection: silhouette
  kmeans_init: k-means++
  kmeans_n_init: 20
  kmeans_max_iterations: 300
  kmeans_tolerance: 1.0e-4
  kmeans_algorithm: lloyd
  unknownness_weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  novelty_normalization_quantile: 0.95
  updq_weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
  separation_floor: 1.0e-12
  calibration_bins: 10
  calibration_minimum_bin_samples: 20
  calibration_minimum_bin_fraction: 0.01
