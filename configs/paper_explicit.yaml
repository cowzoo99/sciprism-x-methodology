generators:
  model_ids:
    - gpt-4o-2024-08-06
    - claude-3.5-sonnet-20241022
    - gemini-1.5-pro-002
    - Llama-3.1-70B-Instruct
    - Qwen2.5-72B-Instruct
    - Mistral-Large-2411
  temperature: 0.0
  max_output_tokens: 2048
  responses_per_task: 3
  evaluation_period: ["2024-10", "2025-01"]
judge:
  model_id: gpt-4o-2024-08-06
  dataset: scicueval
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 512
datasets:
  scicueval:
    role: primary
  dbp15k:
    role: auxiliary
    language_pairs: [ZH-EN, JA-EN, FR-EN]
