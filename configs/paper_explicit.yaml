  names: [iid, motif_or_structure, domain_transfer, boundary_stress]
  nonstress_cases: 600
  boundary_stress_cases: 2400
paper:
  seeds: [42, 0, 1, 123, 1234]
  hyperparameter_trials: 50
  patience: 10
  max_epochs: 100
  bootstrap_resamples: 1000
  confidence_level: 0.95
  two_sided_tests: true
  correction: holm_bonferroni
